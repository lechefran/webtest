name: Bug report
description: Report something that isn't working as documented.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short Go program or test that reproduces the issue.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: webtest version
      placeholder: v0.5.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version and OS
      placeholder: go1.27.2 linux/amd64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
